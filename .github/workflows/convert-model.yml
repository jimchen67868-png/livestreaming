name: Build NSFW model
on: workflow_dispatch
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install "tensorflow==2.15.1" "tensorflow_hub==0.16.1" "numpy<2"
      - run: python tools/convert_model.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/assets/nsfw.tflite
          git commit -m "Add NSFW tflite model" || echo "nothing to commit"
          git push
