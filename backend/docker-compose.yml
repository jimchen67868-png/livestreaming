services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "1935:1935"      # RTMP ingest
      - "8888:8888"      # LL-HLS playback
      - "8889:8889"      # WebRTC
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"      # rooms list + chat/gifts WebSocket
